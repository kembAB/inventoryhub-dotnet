# InventoryHub — full stack in Docker: app + PostgreSQL.
# The ONLY change from the local run is configuration: the app is switched
# from SQLite to PostgreSQL through environment variables.
#
#   docker compose up --build
#   App: http://localhost:8080

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Configuration-only database switch (see Program.cs)
      DatabaseProvider: "Npgsql"
      ConnectionStrings__PostgresConnection: "Host=db;Port=5432;Database=inventoryhub;Username=postgres;Password=changeme"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventoryhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventoryhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
