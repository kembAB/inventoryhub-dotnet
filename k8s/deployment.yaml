# InventoryHub — Kubernetes Deployment
# Runs 2 replicas of the app container. Configuration comes from the
# ConfigMap (non-secret settings) and the Secret (connection string).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventoryhub
  labels:
    app: inventoryhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventoryhub
  template:
    metadata:
      labels:
        app: inventoryhub
    spec:
      containers:
        - name: inventoryhub
          # Replace with your registry image, e.g.
          # myregistry.azurecr.io/inventoryhub:1.0.0  or  <account>.dkr.ecr.<region>.amazonaws.com/inventoryhub:1.0.0
          image: inventoryhub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DatabaseProvider
              valueFrom:
                configMapKeyRef:
                  name: inventoryhub-config
                  key: DatabaseProvider
            - name: ConnectionStrings__PostgresConnection
              valueFrom:
                secretKeyRef:
                  name: inventoryhub-secret
                  key: PostgresConnection
          readinessProbe:
            httpGet:
              path: /api/products
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/products
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
