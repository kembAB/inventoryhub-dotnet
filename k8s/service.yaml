# InventoryHub — Kubernetes Service
# ClusterIP service: reachable inside the cluster and through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: inventoryhub
  labels:
    app: inventoryhub
spec:
  type: ClusterIP
  selector:
    app: inventoryhub
  ports:
    - name: http
      port: 80
      targetPort: 8080
